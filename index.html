<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hands-On Inkstone Lab</title><style>html,body{margin:0;width:100%;min-height:100%;background:#eee8db;font-family:Arial,sans-serif;color:#17221e;overflow-x:hidden}body{padding:0}*{box-sizing:border-box}.lab{width:100%;max-width:none;margin:0;padding:6px}.head{background:#183229;color:#fff;padding:12px 16px;border-radius:8px}.card{margin-top:6px;background:#fff;border-radius:8px;padding:10px;border:1px solid #d5cebf}.stage{height:min(55vh,480px);min-height:310px;width:100%;position:relative;overflow:hidden;background:#f8f1df;border-radius:8px;margin:8px 0}.stone{position:absolute;width:300px;height:170px;border-radius:50%;background:#666;border:14px solid #494949;left:50%;top:50%;transform:translate(-50%,-45%);box-shadow:inset 0 0 30px #222}.liquid{position:absolute;inset:28px;border-radius:50%;background:#bfe8f5;transition:background .2s,opacity .3s;opacity:0}.liquid.show{opacity:.8}.stick{position:absolute;width:50px;height:135px;border-radius:9px;background:#111;left:calc(50% - 25px);top:80px;touch-action:none;cursor:grab}.dropper{font-size:65px;position:absolute;left:calc(50% - 35px);top:20px;cursor:pointer;user-select:none}.brush{position:absolute;font-size:72px;left:80px;top:90px;cursor:grab;touch-action:none;user-select:none;z-index:3}.bowl{position:absolute;width:170px;height:90px;border-radius:50%;background:#161616;border:12px solid #555;right:75px;top:145px}.paper{position:absolute;width:360px;height:190px;background:#fffaf0;border:2px solid #d3c7ad;right:45px;top:55px}.mark{position:absolute;height:13px;background:#111;border-radius:60%;display:none;transform-origin:left center}.tip{position:absolute;width:22px;height:22px;border-radius:50%;background:#111;display:none;z-index:4}.status{padding:13px;background:#e4efe9;border-radius:10px;min-height:48px}.meter{height:13px;background:#ddd;border-radius:9px;overflow:hidden}.fill{height:100%;background:#222;width:0}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.status{margin:8px 0}.btn{background:#183229;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.4}.btn:focus-visible,.dropper:focus-visible,.stick:focus-visible,.brush:focus-visible{outline:3px solid #de941b;outline-offset:3px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:600px){.lab{padding:3px}.head{padding:9px 10px}.head h1{font-size:1.3rem}.head p{margin-bottom:2px}.card{padding:7px}.stage{height:360px;min-height:360px}.brush{left:25px}.bowl{right:25px}.paper{width:70%;right:15px}}</style></head><body><main class="lab"><header class="head"><h1>🔎 Detective Malik's Inkstone Lab</h1><p>Prepare traditional ink by completing each action yourself.</p></header><section class="card"><h2 id="title">Step 1: Add Water</h2><p id="inst">Drag the water dropper over the inkstone and release it.</p><div class="controls"><button class="btn" id="next" disabled>Next clue →</button><button class="btn" id="reset">Reset lab</button></div><p class="status" id="status" role="status" aria-live="polite">💧 Malik: “First clue: water. Add it to the inkstone.”</p><div class="stage" id="stage"></div><div class="meter" id="meter"><div class="fill" id="fill"></div></div></section></main><script>(()=>{const stage=document.querySelector('#stage'),title=document.querySelector('#title'),inst=document.querySelector('#inst'),status=document.querySelector('#status'),next=document.querySelector('#next'),fill=document.querySelector('#fill'),meter=document.querySelector('#meter');let step=1,grind=0;function say(s){status.textContent=s}function stone(){stage.innerHTML='<div class="stone"><div class="liquid" id="liquid"></div></div><div class="dropper" id="drop" tabindex="0" role="button" aria-label="Water dropper. Drag over inkstone and release.">💧</div>';drag(document.querySelector('#drop'),el=>{document.querySelector('#liquid').classList.add('show');el.style.display='none';say('✅ You added water to the inkstone. Evidence: water is the liquid medium.');next.disabled=false})}function drag(el,onDrop,onMove){let d=false,ox=0,oy=0;el.addEventListener('pointerdown',e=>{d=true;el.setPointerCapture(e.pointerId);let r=el.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top});el.addEventListener('pointermove',e=>{if(!d)return;let r=stage.getBoundingClientRect();let x=e.clientX-r.left-ox,y=e.clientY-r.top-oy;el.style.left=Math.max(0,Math.min(r.width-el.offsetWidth,x))+'px';el.style.top=Math.max(0,Math.min(r.height-el.offsetHeight,y))+'px';if(onMove)onMove(e)});el.addEventListener('pointerup',e=>{if(!d)return;d=false;if(onDrop)onDrop(el,e)})}function grindStage(){stage.innerHTML='<div class="stone"><div class="liquid show" id="liquid"></div></div><div class="stick" id="stick" tabindex="0" role="slider" aria-label="Ink stick. Drag left and right to grind" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>';let s=document.querySelector('#stick'),last=null;s.addEventListener('pointerdown',e=>{last=e.clientX;s.setPointerCapture(e.pointerId)});s.addEventListener('pointermove',e=>{if(last===null)return;let delta=Math.abs(e.clientX-last);last=e.clientX;grind=Math.min(100,grind+delta*.5);s.style.left=Math.max(100,Math.min(stage.clientWidth-150,e.clientX-stage.getBoundingClientRect().left-25))+'px';fill.style.width=grind+'%';s.setAttribute('aria-valuenow',Math.round(grind));let v=Math.max(18,190-grind*1.7);document.querySelector('#liquid').style.background=`rgb(${v},${v},${v})`;if(grind>=100){say('✅ Grinding complete. The water has become dark liquid ink.');next.disabled=false}});s.addEventListener('pointerup',()=>last=null);s.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();grind=Math.min(100,grind+5);fill.style.width=grind+'%';s.setAttribute('aria-valuenow',grind);let v=Math.max(18,190-grind*1.7);document.querySelector('#liquid').style.background=`rgb(${v},${v},${v})`;if(grind>=100){say('✅ Grinding complete. Liquid ink is ready.');next.disabled=false}}})}function inspectStage(){stage.innerHTML='<button class="btn" id="inspect" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.05rem">⚫ Inspect your liquid ink</button>';meter.style.display='none';document.querySelector('#inspect').onclick=()=>{say('🔎 Mystery solved: grinding the solid ink stick with water produced usable liquid ink.');document.querySelector('#inspect').textContent='✓ Ink ready';document.querySelector('#inspect').disabled=true;next.disabled=false}}function brushStage(){stage.innerHTML='<div class="brush" id="brush" tabindex="0" role="button" aria-label="Brush. Drag into the ink bowl.">🖌️</div><div class="bowl" id="bowl" aria-label="Prepared ink bowl"></div><div class="tip" id="tip"></div>';let b=document.querySelector('#brush');drag(b,(el,e)=>{let br=document.querySelector('#bowl').getBoundingClientRect();if(e.clientX>=br.left&&e.clientX<=br.right&&e.clientY>=br.top&&e.clientY<=br.bottom){el.textContent='🖌️';el.style.filter='brightness(.55)';say('✅ You dipped the brush into the ink. The brush is now loaded.');next.disabled=false}else say('Try again: drag the brush into the black ink bowl.')})}function writeStage(){stage.innerHTML='<div class="brush" id="brush" tabindex="0" role="button" aria-label="Loaded brush. Drag across the paper to write.">🖌️</div><div class="paper" id="paper" aria-label="Writing paper"></div>';let b=document.querySelector('#brush'),drawing=false,lastPt=null,made=false;let down=e=>{drawing=true;b.setPointerCapture(e.pointerId);lastPt=null};b.addEventListener('pointerdown',down);b.addEventListener('pointermove',e=>{if(!drawing)return;let sr=stage.getBoundingClientRect();b.style.left=(e.clientX-sr.left-b.offsetWidth/2)+'px';b.style.top=(e.clientY-sr.top-b.offsetHeight/2)+'px';let pr=document.querySelector('#paper').getBoundingClientRect();if(e.clientX>=pr.left&&e.clientX<=pr.right&&e.clientY>=pr.top&&e.clientY<=pr.bottom){let paper=document.querySelector('#paper'),rr=paper.getBoundingClientRect(),x=e.clientX-rr.left,y=e.clientY-rr.top;if(lastPt){let dx=x-lastPt.x,dy=y-lastPt.y,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;let line=document.createElement('div');line.className='mark';line.style.display='block';line.style.left=lastPt.x+'px';line.style.top=lastPt.y+'px';line.style.width=len+'px';line.style.transform='rotate('+ang+'deg)';paper.appendChild(line);made=true;say('🖌️ Keep moving the brush across the paper to make your mark.')}lastPt={x,y}}else lastPt=null});b.addEventListener('pointerup',()=>{drawing=false;if(made){say('✅ Evidence confirmed: You prepared the ink, loaded the brush, and made a visible mark on the paper. Investigation complete!')}})}stone();next.onclick=()=>{step++;next.disabled=true;if(step===2){title.textContent='Step 2: Grind the Ink Stick';inst.textContent='Drag the ink stick left and right across the wet inkstone until the grinding meter is full.';grindStage();say('🖤 Malik: “Rub the ink stick against the wet inkstone.”')}else if(step===3){title.textContent='Step 3: Inspect the Liquid Ink';inst.textContent='Inspect the liquid you produced.';inspectStage();say('⚫ Malik: “Aha! What has the grinding produced?”')}else if(step===4){title.textContent='Step 4: Load the Brush';inst.textContent='Drag the brush into the black ink bowl. The brush must reach the ink before you can continue.';brushStage();say('🖌️ Malik: “Now load the brush with your prepared ink.”')}else if(step===5){title.textContent='Step 5: Make the Mark';inst.textContent='Drag the loaded brush across the paper. Your hand movement will create the ink stroke.';writeStage();next.style.display='none';say('📜 Malik: “Final test. Use the brush and make your own mark.”')}};document.querySelector('#reset').onclick=()=>location.reload()})();</script></body></html>
